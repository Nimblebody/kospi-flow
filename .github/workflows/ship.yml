name: 조선 테마 분석

# 조선·기자재·해운·LNG 종목을 하루 두 번 분석한다.
#   morning  08:00 KST  밤사이 뉴스 + 전날 저녁 분석 이어받기 + 오늘 볼 포인트
#   evening  20:30 KST  종가·애프터마켓·외국인/기관 수급 + 이유 + 전망
#
# 예약은 GitHub 이 아니라 Cloudflare Worker 가 건다. worker/README.md 참고.
# 휴장일(주말 포함)에는 main.py 가 곧바로 끝낸다.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "morning(08:00) 또는 evening(20:30)"
        required: true
        default: evening
        type: choice
        options: [morning, evening]

permissions:
  contents: write
  pages: write
  id-token: write

# 20:30 에 수급 확정 갱신과 같이 깨어난다. 같은 그룹이라 차례로 돈다.
# 둘 다 web/index.html 을 다시 만들어 커밋하므로 동시에 돌면 push 가 엉킨다.
concurrency:
  group: kospi-flow
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 키 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          for name in KIS_APP_KEY KIS_APP_SECRET ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name 이 비어 있습니다."
              missing=1
            else
              echo "$name : 설정됨 (${#value}자)"
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: 조선 분석
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'prod' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --ship "${{ inputs.slot }}"

      - name: 결과 커밋
        run: |
          git config user.name "kospi-flow bot"
          git config user.email "actions@github.com"
          git add web/data web/index.html web/manifest.webmanifest web/sw.js
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이면 정상)"
          else
            git commit -m "조선 분석 $(TZ=Asia/Seoul date +%Y-%m-%d) ${{ inputs.slot }}"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
