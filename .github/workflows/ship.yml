name: 조선 테마 분석

# 조선·기자재·해운·LNG 종목을 하루 두 번 분석한다.
#   morning  08:00 KST  밤사이 뉴스 + 전날 저녁 분석 이어받기 + 오늘 볼 포인트
#   evening  20:30 KST  종가·애프터마켓·외국인/기관 수급 + 이유 + 전망
#
# 예약은 GitHub 이 아니라 Cloudflare Worker 가 건다. worker/README.md 참고.
# 휴장일(주말 포함)에는 main.py 가 곧바로 끝낸다.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "morning(08:00) 또는 evening(20:30)"
        required: true
        default: evening
        type: choice
        options: [morning, evening]

permissions:
  contents: write
  pages: write
  id-token: write

# 20:30 에 수급 확정 갱신과 같이 깨어난다. 같은 그룹이라 차례로 돈다.
# 둘 다 web/index.html 을 다시 만들어 커밋하므로 동시에 돌면 push 가 엉킨다.
concurrency:
  group: kospi-flow
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 키 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          missing=0
          for name in KIS_APP_KEY KIS_APP_SECRET ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name 이 비어 있습니다."
              missing=1
            else
              echo "$name : 설정됨 (${#value}자)"
            fi
          done
          [ "$missing" = "0" ] || exit 1
          # 네이버 키는 없어도 돈다(언론사 RSS + 구글 뉴스로 기사를 모은다).
          if [ -z "$NAVER_CLIENT_ID" ] || [ -z "$NAVER_CLIENT_SECRET" ]; then
            echo "::warning::NAVER_CLIENT_ID/SECRET 이 없어 구글 뉴스로 기사를 모읍니다."
          else
            echo "NAVER 키 : 설정됨"
          fi

      - name: 조선 분석
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'prod' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py --ship "${{ inputs.slot }}"

      - name: 결과 커밋
        run: |
          git config user.name "kospi-flow bot"
          git config user.email "actions@github.com"
          git add web/data web/index.html web/manifest.webmanifest web/sw.js
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이면 정상)"
          else
            git commit -m "조선 분석 $(TZ=Asia/Seoul date +%Y-%m-%d) ${{ inputs.slot }}"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # 배포는 GitHub 쪽에서 가끔 그냥 실패한다. 데이터 커밋은 이미 끝난 뒤라
      # 사이트만 다음 배포까지 늦는다(새벽 뉴스면 08:00 까지). 실제로 본 것.
      #   - 업로드 1초 뒤 조회했더니 아티팩트 0개 (09-08, 11-22)
      #   - Timeout reached (10-15, 11-06) · 배포 생성 502 (11-20)
      # 셋 다 잠시 뒤면 통과하는 종류라 30초 쉬고 한 번 더 한다. 두 번째도 실패면 빨간 X.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
