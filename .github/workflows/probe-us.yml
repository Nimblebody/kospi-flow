name: 미국 시세 코드 확인

# KIS 해외 시세가 이 계정에서 되는지, 심볼 표기가 무엇인지 한 번에 본다.
# 자료마다 SPX / .SPX / .IXIC 처럼 표기가 갈려서, 후보를 전부 넣어 보고
# 실제로 값이 오는 것을 로그에 표로 찍는다. 손으로만 돌린다.
#
# 결과를 보고 src/overseas.py 의 후보 목록 맨 앞에 통하는 코드를 두면
# 다음 실행부터 첫 시도에 맞는다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 후보 코드 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'prod' }}
        run: python main.py --probe-us
