name: 코스피 수급 리포트

on:
  schedule:
    # GitHub 크론은 UTC 기준. 한국시간 = UTC + 9시간.
    - cron: "10 7 * * 1-5"   # 16:10 KST · 장 마감 직후 속보
    - cron: "30 9 * * 1-5"   # 18:30 KST · 수급 확정
  workflow_dispatch:
    inputs:
      stage:
        description: "flash(속보) 또는 final(확정)"
        required: false
        default: final
        type: choice
        options: [flash, final]
      date:
        # 손으로 돌릴 때 지난 거래일을 다시 만들 수 있게. 장중이거나 장 시작 전에
        # 그냥 돌리면 그날 수급이 아직 없어서 리포트가 안 나온다.
        description: "YYYYMMDD (비우면 오늘, KST)"
        required: false
        default: ""
        type: string

# GitHub Actions 크론은 혼잡하면 5~30분 늦게 시작할 수 있습니다.
# 정시 실행이 꼭 필요하면 시간을 앞당겨 잡으세요.

permissions:
  contents: write        # 리포트 JSON 을 저장소에 커밋
  pages: write           # GitHub Pages 배포
  id-token: write

concurrency:
  group: kospi-flow
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 실행 단계 결정
        id: stage
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            echo "value=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ]; then
            echo "value=flash" >> "$GITHUB_OUTPUT"
          else
            echo "value=final" >> "$GITHUB_OUTPUT"
          fi

      # 키가 없으면 4분 돌린 뒤가 아니라 여기서 바로 멈춘다.
      # 값은 찍지 않고 설정 여부와 길이만 본다.
      - name: 키 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          missing=0
          for name in KIS_APP_KEY KIS_APP_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name 이 비어 있습니다."
              missing=1
            else
              echo "$name : 설정됨 (${#value}자)"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Settings > Secrets and variables > Actions 의"
            echo "'Repository secrets' 에 등록되어 있는지 확인하세요."
            echo "Dependabot / Codespaces 탭에 넣으면 워크플로에서 보이지 않습니다."
            exit 1
          fi

      - name: 리포트 생성
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'prod' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --stage "${{ steps.stage.outputs.value }}" --date "${{ inputs.date }}"
          else
            python main.py --stage "${{ steps.stage.outputs.value }}"
          fi

      - name: 리포트 커밋
        run: |
          git config user.name "kospi-flow bot"
          git config user.email "actions@github.com"
          git add web/data web/index.html web/manifest.webmanifest web/sw.js web/icon-*.png
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "리포트 $(TZ=Asia/Seoul date +%Y-%m-%d) ${{ steps.stage.outputs.value }}"
            git pull --rebase --autostash
            git push
          fi

      # ── GitHub Pages 배포 ──────────────────────────────────────────
      # 무료 요금제에서는 '공개 저장소' 만 Pages 를 쓸 수 있습니다.
      # 비공개로 두려면 이 두 스텝을 지우고 README 의 다른 배포 방법을 보세요.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
