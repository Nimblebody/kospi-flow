name: 증시 해설 다시 만들기

# 수급 수집 없이 '왜 움직였나' 만 다시 만들어 배포한다.
# KIS 를 안 부르므로 30초면 끝난다. 해설이 처음 붙는지 확인하거나
# 문구를 손본 뒤 결과를 볼 때 쓴다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (비우면 최신 리포트)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi-flow
  cancel-in-progress: false

jobs:
  explain:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 해설 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --explain-only --date "${{ inputs.date }}"
          else
            python main.py --explain-only
          fi

      - name: 커밋
        run: |
          git config user.name "kospi-flow bot"
          git config user.email "actions@github.com"
          git add web/data web/index.html web/manifest.webmanifest web/sw.js
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "증시 해설 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # 배포는 GitHub 쪽에서 가끔 그냥 실패한다. 데이터 커밋은 이미 끝난 뒤라
      # 사이트만 다음 배포까지 늦는다(새벽 뉴스면 08:00 까지). 실제로 본 것.
      #   - 업로드 1초 뒤 조회했더니 아티팩트 0개 (09-08, 11-22)
      #   - Timeout reached (10-15, 11-06) · 배포 생성 502 (11-20)
      # 셋 다 잠시 뒤면 통과하는 종류라 30초 쉬고 한 번 더 한다. 두 번째도 실패면 빨간 X.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
